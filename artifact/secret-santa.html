<title>Family Secret Santa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column of panels; the reveal is a hanging gift tag. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17221d;
  --muted: #5d6b64;
  --line: #dde3df;
  --pine: #1d5c45;
  --pine-ink: #ffffff;
  --pine-soft: #e3efe9;
  --berry: #b3324a;
  --berry-soft: #f8e6ea;
  --tag: #fbf3dc;
  --tag-ink: #3b2f12;
  --string: #b3324a;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101613; --surface: #18201c; --ink: #e6ede9; --muted: #98a69f; --line: #2b3631;
    --pine: #4fb08a; --pine-ink: #08140f; --pine-soft: #1c3229; --berry: #ec7f93; --berry-soft: #3a1d24;
    --tag: #2f2a1c; --tag-ink: #f3e7c2; --string: #ec7f93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101613; --surface: #18201c; --ink: #e6ede9; --muted: #98a69f; --line: #2b3631;
  --pine: #4fb08a; --pine-ink: #08140f; --pine-soft: #1c3229; --berry: #ec7f93; --berry-soft: #3a1d24;
  --tag: #2f2a1c; --tag-ink: #f3e7c2; --string: #ec7f93; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
header { display: flex; flex-direction: column; gap: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  background: var(--pine-soft); color: var(--ink); font-size: .85rem; }
.chip.berry { background: var(--berry-soft); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;
  display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; align-self: flex-start; }
.tabs button { background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 16px; }
.tabs button[aria-selected="true"] { background: var(--pine); color: var(--pine-ink); }
label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); min-width: 0; }
input, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 11px; width: 100%; }
textarea { resize: vertical; min-height: 110px; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
button { font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px; padding: 9px 16px;
  background: var(--pine); color: var(--pine-ink); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.ghost { background: transparent; color: var(--pine); border: 1px solid var(--line); }
button.danger { background: transparent; color: var(--berry); border: 1px solid var(--line); }
button.danger.armed { background: var(--berry); color: var(--surface); border-color: var(--berry); }
button.small { padding: 5px 10px; font-size: .82rem; }
button.big { font-size: 1.1rem; padding: 14px 26px; border-radius: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.row > label { flex: 1 1 160px; }
.people { display: flex; flex-direction: column; }
.person { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.person:first-child { border-top: 0; padding-top: 0; }
.person .who { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.person .name { font-weight: 600; font-size: 1rem; }
.person .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .85rem; }
.person .actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-content: flex-start; }
.avatar { width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; grid-column: 1 / -1; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
.checks label { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-size: .9rem; }
.checks input { width: auto; }
.edit { grid-column: 1 / -1; }
.notice { padding: 10px 14px; border-radius: 10px; background: var(--pine-soft); font-size: .92rem; }
.notice.warn { background: var(--berry-soft); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; max-width: calc(100% - 32px); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.steps .done { color: var(--muted); text-decoration: line-through; }
.names { display: flex; flex-wrap: wrap; gap: 8px; }
.names button { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.names button[aria-pressed="true"] { background: var(--pine); color: var(--pine-ink); border-color: var(--pine); }
.center { align-items: center; text-align: center; }
.copy-field { font-size: .8rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

/* The gift tag */
.tag-stage { display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; }
.string { width: 2px; height: 34px; background: var(--string); }
.tag { position: relative; width: min(320px, 100%); background: var(--tag); color: var(--tag-ink);
  clip-path: polygon(16% 0, 84% 0, 100% 14%, 100% 100%, 0 100%, 0 14%);
  padding: 46px 26px 26px; text-align: center; display: flex; flex-direction: column; gap: 6px;
  transform-origin: 50% 0; animation: swing 1.8s ease-out 1; }
.tag::before { content: ""; position: absolute; top: 14px; left: 50%; width: 14px; height: 14px; margin-left: -7px;
  border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2px var(--string); }
.tag .to { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
.tag .recipient { font-family: var(--display); font-weight: 800; font-size: clamp(1.9rem, 7vw, 2.6rem); line-height: 1.05; overflow-wrap: anywhere; }
.tag .from { font-size: .9rem; opacity: .75; margin-top: 6px; }
@keyframes swing { 0% { transform: rotate(-9deg); } 35% { transform: rotate(6deg); } 65% { transform: rotate(-3deg); } 100% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { .tag { animation: none; } }
.wishlist-view { background: var(--bg); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 520px) {
  .person { grid-template-columns: 1fr; }
  .person .actions { justify-content: flex-start; }
}
</style>

<div class="wrap" id="app">
  <header>
    <span class="eyebrow">Secret Santa</span>
    <h1>Opening the sack…</h1>
    <p class="muted">Loading your family's draw.</p>
  </header>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// Set after the first publish so invite links point at this artifact.
const ARTIFACT_URL = "https://claude.ai/artifact/LFydhfL6sepDA64a286qge";

const app = document.getElementById("app");
const S = {
  phase: "loading",          // loading | nodb | ready | slow
  db: null, user: null, myId: null, isOwner: false,
  event: null, eventLoaded: false,
  members: {}, membersLoaded: false,
  myPick: null,
  profiles: {},
  tab: null,
  editing: null,             // pid whose name/household is being edited
  exclEditing: null,         // pid whose exclusions are open
  armed: null,               // key of a two-step destructive button
  selectedPid: null,         // name chosen on the claim screen
  busy: false,
};
const drafts = {};

// ---------- helpers ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200);
}
function field(id, value, attrs = {}) {
  return h(attrs.multiline ? "textarea" : "input", {
    id, value: drafts[id] ?? value ?? "", oninput: e => (drafts[id] = e.target.value),
    ...Object.fromEntries(Object.entries(attrs).filter(([k]) => k !== "multiline")),
  });
}
let writeChain = Promise.resolve();
function queued(fn) { // one write at a time
  const p = writeChain.then(fn);
  writeChain = p.catch(() => {});
  return p;
}
async function act(fn, okMsg) {
  if (S.busy) return;
  S.busy = true; render();
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { console.error(e); toast(e.userMessage || "That didn't save. Check your connection and try again."); }
  finally { S.busy = false; render(); }
}
function fail(msg) { const e = new Error(msg); e.userMessage = msg; throw e; }

// ---------- derived state ----------
const ev = () => S.event || { eventName: "Family Secret Santa", budget: "", exchangeDate: "", participants: [], drawId: null, drawnAt: null };
const people = () => ev().participants || [];
const drawn = () => Boolean(ev().drawId);
const byPid = pid => people().find(p => p.id === pid);
function claimsByPid() {
  const m = {};
  for (const [uid, d] of Object.entries(S.members)) if (d.pid && byPid(d.pid)) (m[d.pid] ||= []).push(uid);
  return m;
}
const me = () => S.members[S.myId];
const myPerson = () => me() && byPid(me().pid);
const memberFor = pid => Object.values(S.members).find(d => d.pid === pid);
const validPick = () => S.myPick && S.myPick.drawId === ev().drawId ? S.myPick : null;

// ---------- the draw ----------
function canGive(g, r) {
  if (g.id === r.id) return false;
  const hg = (g.household || "").trim().toLowerCase(), hr = (r.household || "").trim().toLowerCase();
  if (hg && hg === hr) return false;
  if ((g.exclusions || []).includes(r.id) || (r.exclusions || []).includes(g.id)) return false;
  return true;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function drawNames(ps) {
  if (ps.length < 2) fail("Add at least 2 people before drawing.");
  const opts = new Map(ps.map(g => [g.id, ps.filter(r => canGive(g, r))]));
  for (const p of ps) if (!opts.get(p.id).length) fail(`${p.name} has nobody they're allowed to draw. Remove an exclusion.`);
  const givers = shuffle(ps).sort((a, b) => opts.get(a.id).length - opts.get(b.id).length);
  const result = {}, taken = new Set(); let steps = 0;
  (function solve(i) {
    if (i === givers.length) return true;
    if (++steps > 200000) return false;
    for (const r of shuffle(opts.get(givers[i].id))) {
      if (taken.has(r.id)) continue;
      taken.add(r.id); result[givers[i].id] = r.id;
      if (solve(i + 1)) return true;
      taken.delete(r.id); delete result[givers[i].id];
    }
    return false;
  })(0) || fail("No draw works with these households and exclusions. Remove an exclusion and try again.");
  return result;
}

// ---------- writes ----------
const eventRef = () => S.db.doc("setup/event");
const saveEvent = next => queued(() => eventRef().set(next));
const memberRef = uid => S.db.doc("members/" + uid);

function updateEvent(patch) { return saveEvent({ ...ev(), ...patch }); }

async function doDraw() {
  const ps = people();
  const claims = claimsByPid();
  const missing = ps.filter(p => !claims[p.id]);
  if (missing.length) fail(`Waiting for ${missing.map(p => p.name).join(", ")} to open the page and pick their name.`);
  const dupes = ps.filter(p => claims[p.id].length > 1);
  if (dupes.length) fail(`More than one account picked ${dupes.map(p => p.name).join(", ")}. Unlink the wrong one first.`);
  const result = drawNames(ps);
  const drawId = rid();
  // clear any old picks, then write new ones, then announce the draw
  const old = await S.db.collection("picks").get();
  for (const d of old.docs) await S.db.doc("picks/" + d.id).delete();
  for (const p of ps) await S.db.doc("picks/" + claims[p.id][0]).set({ receiverPid: result[p.id], drawId });
  await updateEvent({ drawId, drawnAt: new Date().toISOString() });
}
async function undoDraw() {
  await updateEvent({ drawId: null, drawnAt: null });
  const old = await S.db.collection("picks").get();
  for (const d of old.docs) await S.db.doc("picks/" + d.id).delete();
}

// ---------- rendering ----------
function render() {
  const active = document.activeElement, activeId = active && active.id;
  const sel = activeId && "selectionStart" in active ? [active.selectionStart, active.selectionEnd] : null;
  app.replaceChildren(...view());
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch {} }
  }
  // names for organiser view
  if (S.isOwner && S.user) {
    const ids = Object.keys(S.members).filter(id => !S.profiles[id]);
    if (ids.length) S.user.profiles(ids).then(ps => { Object.assign(S.profiles, ps); render(); });
  }
}

function headerView() {
  const e = ev();
  const facts = [];
  if (e.budget) facts.push(h("span", { class: "chip" }, "Budget ", h("strong", {}, e.budget)));
  if (e.exchangeDate) facts.push(h("span", { class: "chip" }, "Exchange ", h("strong", {}, e.exchangeDate)));
  facts.push(h("span", { class: "chip plain" }, `${people().length} ${people().length === 1 ? "person" : "people"}`));
  const p = myPerson();
  return h("header", {},
    h("span", { class: "eyebrow" }, p ? `Hi ${p.name}` : "Secret Santa"),
    h("h1", {}, e.eventName || "Family Secret Santa"),
    h("div", { class: "facts" }, facts));
}

function view() {
  if (S.phase === "loading") return [h("header", {}, h("span", { class: "eyebrow" }, "Secret Santa"), h("h1", {}, "Opening the sack…"), h("p", { class: "muted" }, "Loading your family's draw."))];
  if (S.phase === "nodb") return [h("header", {}, h("span", { class: "eyebrow" }, "Secret Santa"), h("h1", {}, "Sign in to join the draw")),
    h("section", { class: "panel" },
      h("p", {}, "This page needs to know who you are so it can show you, and only you, who you're buying for."),
      h("p", { class: "muted" }, "Sign in to claude.ai with the email address the organiser invited, then open this link again. If you're already signed in, ask the organiser to share the page with you as a Contributor."))];
  const out = [];
  if (S.phase === "slow") out.push(h("div", { class: "notice warn" }, "The draw can't be reached yet. It will appear when your connection catches up."));
  out.push(headerView());
  if (S.isOwner) {
    if (!S.tab) S.tab = "organise";
    out.push(h("div", { class: "tabs", role: "tablist" },
      ["organise", "mine"].map(t => h("button", { role: "tab", "aria-selected": String(S.tab === t), onclick: () => { S.tab = t; render(); } },
        t === "organise" ? "Organise" : "My Secret Santa"))));
    if (S.tab === "organise") return out.concat(organiserView());
  }
  return out.concat(participantView());
}

// ----- participant -----
function participantView() {
  if (!S.eventLoaded || !S.membersLoaded) return [h("section", { class: "panel" }, h("p", { class: "muted" }, "Loading…"))];
  if (!S.event || !people().length) return [h("section", { class: "panel" },
    h("h2", {}, "Nothing to draw yet"),
    h("p", { class: "muted" }, S.isOwner ? "Add your family on the Organise tab first." : "The organiser hasn't added anyone yet. Check back soon."))];
  const mine = me(), person = myPerson();
  if (!person) return [claimView()];

  const sections = [];
  const pick = validPick();
  if (!drawn()) {
    sections.push(h("section", { class: "panel center" },
      h("h2", {}, "Names haven't been drawn yet"),
      h("p", { class: "muted" }, "You're in. When the organiser draws names, your person will appear here. Add some gift ideas below for whoever draws you.")));
  } else if (!pick) {
    sections.push(h("section", { class: "panel center" }, h("p", { class: "muted" }, "Names have been drawn. Fetching yours…")));
  } else if (mine.revealedDrawId !== ev().drawId) {
    sections.push(h("section", { class: "panel center" },
      h("h2", {}, "Names have been drawn"),
      h("p", { class: "muted" }, "Make sure nobody's looking over your shoulder."),
      h("button", { class: "big", disabled: S.busy, onclick: () => act(() => queued(() => memberRef(S.myId).update({ revealedDrawId: ev().drawId, revealedAt: new Date().toISOString() }))) }, "Reveal who I'm buying for")));
  } else {
    const r = byPid(pick.receiverPid);
    const rm = memberFor(pick.receiverPid);
    sections.push(h("section", { class: "panel" },
      h("div", { class: "tag-stage", "aria-live": "polite" },
        h("div", { class: "string" }),
        h("div", { class: "tag" },
          h("span", { class: "to" }, "To"),
          h("span", { class: "recipient" }, r ? r.name : "Someone"),
          h("span", { class: "from" }, "From: Secret Santa", ev().budget ? ` · ${ev().budget}` : ""))),
      h("h3", {}, r ? `${r.name}'s gift ideas` : "Their gift ideas"),
      rm && rm.wishlist ? h("div", { class: "wishlist-view" }, rm.wishlist)
        : h("p", { class: "muted" }, `${r ? r.name : "They"} hasn't added any ideas yet. This updates as soon as they do.`)));
  }

  sections.push(h("section", { class: "panel" },
    h("h2", {}, "Your wishlist"),
    h("p", { class: "muted" }, "Whoever drew you sees this. Sizes, hints, links, things you definitely don't want."),
    field("wishlist", mine.wishlist, { multiline: true, maxlength: "4000", "aria-label": "Your wishlist" }),
    h("div", { class: "row" },
      h("button", { disabled: S.busy, onclick: () => act(async () => {
        const text = (drafts.wishlist ?? mine.wishlist ?? "").slice(0, 4000);
        await queued(() => memberRef(S.myId).update({ wishlist: text }));
        delete drafts.wishlist;
      }, "Wishlist saved") }, "Save wishlist"),
      !drawn() && h("button", { class: "ghost", disabled: S.busy, onclick: () => act(() => queued(() => memberRef(S.myId).update({ pid: null }))) }, `Not ${person.name}? Change name`))));
  return sections;
}

function claimView() {
  const claims = claimsByPid();
  const free = people().filter(p => !claims[p.id]);
  if (drawn()) return h("section", { class: "panel" }, h("h2", {}, "Names have already been drawn"),
    h("p", { class: "muted" }, "You weren't linked to a name before the draw. Ask the organiser to undo the draw so you can join."));
  if (!free.length) return h("section", { class: "panel" }, h("h2", {}, "Everyone's already joined"),
    h("p", { class: "muted" }, "Every name has been picked. If one of them is you, ask the organiser to unlink it."));
  const fromHash = (location.hash.match(/^#join-([a-z0-9]+)$/) || [])[1];
  if (!S.selectedPid && fromHash && free.some(p => p.id === fromHash)) S.selectedPid = fromHash;
  const chosen = free.find(p => p.id === S.selectedPid);
  return h("section", { class: "panel" },
    h("h2", {}, "Which one are you?"),
    h("p", { class: "muted" }, "Pick your name once. This page will remember you on any device you sign in on."),
    h("div", { class: "names" }, free.map(p => h("button", { "aria-pressed": String(p.id === S.selectedPid), onclick: () => { S.selectedPid = p.id; render(); } }, p.name))),
    h("div", { class: "row" }, h("button", { disabled: !chosen || S.busy, onclick: () => act(async () => {
      const existing = me() || {};
      await queued(() => memberRef(S.myId).set({ pid: chosen.id, wishlist: existing.wishlist || "", joinedAt: new Date().toISOString(), revealedDrawId: null }));
    }, chosen ? `Welcome, ${chosen.name}` : "") }, chosen ? `I'm ${chosen.name}` : "Choose your name")));
}

// ----- organiser -----
function organiserView() {
  const e = ev(), ps = people(), claims = claimsByPid(), isDrawn = drawn();
  const out = [];

  out.push(h("section", { class: "panel" },
    h("h2", {}, "Event details"),
    h("div", { class: "row" },
      h("label", { for: "evName" }, "Event name", field("evName", e.eventName)),
      h("label", { for: "evBudget" }, "Budget", field("evBudget", e.budget, { placeholder: "e.g. £30" })),
      h("label", { for: "evDate" }, "Gift exchange", field("evDate", e.exchangeDate, { placeholder: "e.g. Christmas Eve" }))),
    h("div", { class: "row" }, h("button", { disabled: S.busy, onclick: () => act(async () => {
      await updateEvent({
        eventName: (drafts.evName ?? e.eventName ?? "").trim().slice(0, 80) || "Family Secret Santa",
        budget: (drafts.evBudget ?? e.budget ?? "").trim().slice(0, 40),
        exchangeDate: (drafts.evDate ?? e.exchangeDate ?? "").trim().slice(0, 60),
        participants: ps,
      });
      delete drafts.evName; delete drafts.evBudget; delete drafts.evDate;
    }, "Details saved") }, "Save details"))));

  const rows = ps.map(p => personRow(p, claims, isDrawn));
  out.push(h("section", { class: "panel" },
    h("h2", {}, `Family (${ps.length})`),
    h("p", { class: "muted" }, "People in the same household never draw each other, so put spouses and partners together. Use “Can't draw” for any other pair."),
    ps.length ? h("div", { class: "people" }, rows) : h("p", { class: "muted" }, "Nobody added yet. Start with yourself."),
    !isDrawn && h("div", { class: "row" },
      h("label", { for: "newName" }, "Name", field("newName", "", { placeholder: "e.g. Auntie Sue", maxlength: "60" })),
      h("label", { for: "newHouse" }, "Household", field("newHouse", "", { placeholder: "e.g. The Smiths", maxlength: "60", list: "houses" })),
      h("datalist", { id: "houses" }, [...new Set(ps.map(p => p.household).filter(Boolean))].map(x => h("option", { value: x }))),
      h("button", { disabled: S.busy, onclick: () => act(async () => {
        const name = (drafts.newName || "").trim();
        if (!name) fail("Type a name first.");
        await updateEvent({ participants: [...ps, { id: rid(), name, household: (drafts.newHouse || "").trim(), exclusions: [] }] });
        drafts.newName = "";
      }, "Added") }, "Add person"))));

  out.push(drawPanel(ps, claims, isDrawn));
  return out;
}

function personRow(p, claims, isDrawn) {
  const ps = people();
  const uids = claims[p.id] || [];
  const excl = (p.exclusions || []).map(byPid).filter(Boolean);
  const meta = [];
  if (p.household) meta.push(h("span", { class: "chip" }, p.household));
  if (excl.length) meta.push(h("span", { class: "chip berry" }, "Can't draw ", excl.map(x => x.name).join(", ")));
  if (!uids.length) meta.push(h("span", { class: "chip plain" }, "Hasn't joined yet"));
  for (const uid of uids) {
    const prof = S.profiles[uid];
    meta.push(h("span", { class: "chip plain" },
      prof && h("img", { class: "avatar", src: prof.avatarUrl, alt: "" }),
      uid === S.myId ? "You" : (prof && prof.name) || "Joined"));
  }
  if (isDrawn && uids.length) {
    const seen = S.members[uids[0]]?.revealedDrawId === ev().drawId;
    meta.push(h("span", { class: "chip" + (seen ? "" : " plain") }, seen ? "Has looked" : "Not looked yet"));
  }
  if (uids.length > 1) meta.push(h("span", { class: "chip berry" }, "Picked by more than one account"));

  const link = (ARTIFACT_URL || "") + "#join-" + p.id;
  const actions = [
    h("button", { class: "ghost small", onclick: async () => {
      const text = ARTIFACT_URL ? link : `Open this page and pick "${p.name}"`;
      try { await navigator.clipboard.writeText(text); toast(`Invite link for ${p.name} copied`); }
      catch { drafts["link-" + p.id] = text; S.showLink = p.id; render(); }
    } }, "Copy invite link"),
  ];
  if (!isDrawn) {
    actions.push(h("button", { class: "ghost small", onclick: () => { S.editing = S.editing === p.id ? null : p.id; render(); } }, "Edit"));
    actions.push(h("button", { class: "ghost small", onclick: () => { S.exclEditing = S.exclEditing === p.id ? null : p.id; render(); } }, "Can't draw…"));
  }
  if (uids.length && !isDrawn) actions.push(armedButton("unlink-" + p.id, "Unlink account", "Confirm unlink", () =>
    act(async () => { for (const uid of uids) await queued(() => memberRef(uid).update({ pid: null })); }, `${p.name} unlinked`)));
  if (!isDrawn) actions.push(armedButton("rm-" + p.id, "Remove", "Confirm remove", () => act(async () => {
    const rest = ps.filter(x => x.id !== p.id).map(x => ({ ...x, exclusions: (x.exclusions || []).filter(id => id !== p.id) }));
    await updateEvent({ participants: rest });
    for (const uid of uids) await queued(() => memberRef(uid).update({ pid: null }));
  }, `${p.name} removed`)));

  const extra = [];
  if (S.showLink === p.id) extra.push(h("div", { class: "edit" }, field("link-" + p.id, link, { readonly: true, class: "copy-field", onfocus: e => e.target.select(), "aria-label": "Invite link" })));
  if (S.editing === p.id && !isDrawn) extra.push(h("div", { class: "edit row" },
    h("label", { for: "ename-" + p.id }, "Name", field("ename-" + p.id, p.name, { maxlength: "60" })),
    h("label", { for: "ehouse-" + p.id }, "Household", field("ehouse-" + p.id, p.household, { maxlength: "60", list: "houses" })),
    h("button", { class: "small", disabled: S.busy, onclick: () => act(async () => {
      const name = (drafts["ename-" + p.id] ?? p.name).trim() || p.name;
      const household = (drafts["ehouse-" + p.id] ?? p.household ?? "").trim();
      await updateEvent({ participants: ps.map(x => x.id === p.id ? { ...x, name, household } : x) });
      delete drafts["ename-" + p.id]; delete drafts["ehouse-" + p.id]; S.editing = null;
    }, "Saved") }, "Save")));
  if (S.exclEditing === p.id && !isDrawn) {
    const others = ps.filter(o => o.id !== p.id);
    extra.push(h("div", { class: "checks" },
      h("span", { class: "eyebrow", style: "flex-basis:100%" }, `${p.name} can't draw`),
      others.map(o => {
        const sameHouse = p.household && o.household && p.household.trim().toLowerCase() === o.household.trim().toLowerCase();
        return h("label", {}, h("input", { type: "checkbox", id: `ex-${p.id}-${o.id}`, checked: sameHouse || (p.exclusions || []).includes(o.id), disabled: sameHouse || S.busy,
          onchange: ev2 => act(async () => {
            const cur = new Set(p.exclusions || []);
            ev2.target.checked ? cur.add(o.id) : cur.delete(o.id);
            await updateEvent({ participants: people().map(x => x.id === p.id ? { ...x, exclusions: [...cur] } : x) });
          }) }), o.name + (sameHouse ? " (same household)" : ""));
      })));
  }

  return h("div", { class: "person" },
    h("div", { class: "who" }, h("span", { class: "name" }, p.name), h("div", { class: "meta" }, meta)),
    h("div", { class: "actions" }, actions),
    extra);
}

function armedButton(key, label, confirmLabel, onConfirm) {
  const armed = S.armed === key;
  return h("button", { class: "danger small" + (armed ? " armed" : ""), disabled: S.busy, onclick: () => {
    if (armed) { S.armed = null; onConfirm(); } else { S.armed = key; render(); setTimeout(() => { if (S.armed === key) { S.armed = null; render(); } }, 4000); }
  } }, armed ? confirmLabel : label);
}

function drawPanel(ps, claims, isDrawn) {
  if (isDrawn) {
    const looked = ps.filter(p => (claims[p.id] || []).some(uid => S.members[uid]?.revealedDrawId === ev().drawId)).length;
    return h("section", { class: "panel" },
      h("h2", {}, "Names are drawn"),
      h("p", {}, `Drawn ${new Date(ev().drawnAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}. ${looked} of ${ps.length} have looked at their person.`),
      h("p", { class: "muted" }, "This page never shows you who drew whom, so you can take part too. Your own person is on the My Secret Santa tab."),
      h("div", { class: "row" }, h("div", {}, armedButton("undo", "Undo draw", "Confirm: everyone gets a new person", () => act(undoDraw, "Draw undone")))));
  }
  const joined = ps.filter(p => claims[p.id]).length;
  const steps = [
    [ps.length >= 2, "Add everyone, with households for couples"],
    [ps.length >= 2 && joined === ps.length, `Everyone opens the page and picks their name (${joined} of ${ps.length} joined)`],
    [false, "Draw names"],
  ];
  const ready = ps.length >= 2 && joined === ps.length;
  return h("section", { class: "panel" },
    h("h2", {}, "The draw"),
    h("ol", { class: "steps" }, steps.map(([done, text]) => h("li", { class: done ? "done" : null }, text))),
    h("div", { class: "row" }, h("button", { class: "big", disabled: !ready || S.busy, onclick: () => act(doDraw, "Names drawn. Everyone can look now.") }, "Draw names")),
    !ready && ps.length >= 2 && h("p", { class: "muted" }, "Each person's pick is tied to their claude.ai account, so everyone needs to join before you draw. Use “Copy invite link” to send each person their own link."));
}

// ---------- boot ----------
(async () => {
  const slow = setTimeout(() => { if (S.phase === "loading") { S.phase = "slow"; render(); } }, 10000);
  const [db, user] = window.claude ? await Promise.all([claude.use("db"), claude.use("user")]) : [null, null];
  const id = user ? await user.id() : null;
  if (!db || !id) { clearTimeout(slow); S.phase = "nodb"; render(); return; }
  Object.assign(S, { db, user, myId: id, isOwner: await user.isOwner() });
  const settle = () => { if (S.eventLoaded && S.membersLoaded) { clearTimeout(slow); S.phase = "ready"; } render(); };
  const onErr = err => { console.error(err); clearTimeout(slow); toast("Lost touch with the draw. Reload the page to reconnect."); };
  db.doc("setup/event").onSnapshot(snap => {
    S.event = snap.exists ? snap.data() : null;
    if (!snap.metadata.fromCache) S.eventLoaded = true; else S.eventLoaded ||= Boolean(S.event);
    settle();
  }, onErr);
  db.collection("members").onSnapshot(snap => {
    S.members = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    if (!snap.metadata.fromCache) S.membersLoaded = true; else S.membersLoaded ||= snap.size > 0;
    settle();
  }, onErr);
  db.doc("picks/" + id).onSnapshot(snap => { S.myPick = snap.exists ? snap.data() : null; render(); }, onErr);
  window.addEventListener("hashchange", () => { S.selectedPid = null; render(); });
})();
</script>
